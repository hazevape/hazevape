name = "roblox-license-api"
main = "src.js"
compatibility_date = "2026-09-01"

# Replace database_id after: npx wrangler d1 create roblox-licenses
[[d1_databases]]
binding = "DB"
database_name = "roblox-licenses"
database_id = "REPLACE_WITH_DATABASE_ID"

[vars]
# Must exactly match the URL hosting your GitHub Pages site, without trailing slash.
SITE_ORIGIN = "https://YOUR_USERNAME.github.io"
